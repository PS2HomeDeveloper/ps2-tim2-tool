name: Build Executables

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SRC_PATH: src/c/ps2_tim2_tool.c

jobs:

  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          if [ -z "$assets" ]; then
            echo "لا توجد ملفات مرفوعة حاليًا بالإصدار."
          else
            for name in $assets; do
              echo "حذف: $name"
              gh release delete-asset v1.0.0 "$name" --repo "$GITHUB_REPOSITORY" -y
            done
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move v1.0.0 tag to latest commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1.0.0
          git push origin v1.0.0 --force



  # ─────────────────────────────────────────────
  # Windows (x86_64 / x86 / arm64) — مكتبات جاهزة رسميًا عبر MSYS2/MinGW
  # ─────────────────────────────────────────────
  build-windows:
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows_x86_64
            runner: windows-latest
            msystem: MINGW64
            pkg_prefix: mingw-w64-x86_64
            compiler: gcc
          - target: windows_x86
            runner: windows-latest
            msystem: MINGW32
            pkg_prefix: mingw-w64-i686
            compiler: gcc
          - target: windows_arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            pkg_prefix: mingw-w64-clang-aarch64
            compiler: clang

    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            ${{ matrix.pkg_prefix }}-toolchain
            ${{ matrix.pkg_prefix }}-libpng
            ${{ matrix.pkg_prefix }}-libjpeg-turbo
            ${{ matrix.pkg_prefix }}-giflib
            ${{ matrix.pkg_prefix }}-libtiff
            ${{ matrix.pkg_prefix }}-libwebp

      - name: Build (${{ matrix.target }})
        run: |
          mkdir -p dist
          cat > /tmp/win_compat_prelude.h <<'PRELUDE_EOF'
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <stdio.h>
          #include <stdlib.h>
          #define mkdir(path, mode) mkdir(path)
          static ssize_t ps1_getline(char **lineptr, size_t *n, FILE *stream) {
              if (*lineptr == NULL || *n == 0) {
                  *n = 128;
                  *lineptr = (char *)malloc(*n);
                  if (*lineptr == NULL) return -1;
              }
              size_t pos = 0;
              int c;
              while ((c = fgetc(stream)) != EOF) {
                  if (pos + 1 >= *n) {
                      size_t new_size = (*n) * 2;
                      char *new_ptr = (char *)realloc(*lineptr, new_size);
                      if (!new_ptr) return -1;
                      *n = new_size;
                      *lineptr = new_ptr;
                  }
                  (*lineptr)[pos++] = (char)c;
                  if (c == '\n') break;
              }
              if (pos == 0 && c == EOF) return -1;
              (*lineptr)[pos] = '\0';
              return (ssize_t)pos;
          }
          #define getline ps1_getline
          PRELUDE_EOF
          ${{ matrix.compiler }} -O3 -std=gnu11 -Wall -Wextra \
            -include /tmp/win_compat_prelude.h \
            "$SRC_PATH" \
            -lpng -ljpeg -lgif -ltiff -lwebp -lz -lm \
            -o "dist/ps2_tim2_tool_${{ matrix.target }}.exe"

      - name: Upload to v1.0.0 release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/ps2_tim2_tool_${{ matrix.target }}.exe" --repo "$GITHUB_REPOSITORY" --clobber



  # ─────────────────────────────────────────────
  # Linux (x86_64 / x86 / arm64) — مكتبات جاهزة رسميًا عبر apt
  # ─────────────────────────────────────────────
  build-linux:
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_x86_64
            runner: ubuntu-latest
            m32: false
          - target: linux_x86
            runner: ubuntu-latest
            m32: true
          - target: linux_arm64
            runner: ubuntu-24.04-arm
            m32: false

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (64-bit / arm64)
        if: matrix.m32 == false
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev libjpeg-dev libgif-dev libtiff-dev libwebp-dev

      - name: Install dependencies (x86 32-bit عبر multiarch)
        if: matrix.m32 == true
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib \
            libpng-dev:i386 libjpeg-dev:i386 libgif-dev:i386 libtiff-dev:i386 libwebp-dev:i386

      - name: Build (${{ matrix.target }})
        run: |
          mkdir -p dist
          gcc -O3 -std=c11 -Wall -Wextra ${{ matrix.m32 && '-m32' || '' }} \
            "$SRC_PATH" \
            -lpng -ljpeg -lgif -ltiff -lwebp -lz -lm \
            -o "dist/ps2_tim2_tool_${{ matrix.target }}"

      - name: Upload to v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/ps2_tim2_tool_${{ matrix.target }}" --repo "$GITHUB_REPOSITORY" --clobber



  # ─────────────────────────────────────────────
  # macOS arm64 — مكتبات جاهزة رسميًا عبر Homebrew (تشغيل أصلي)
  # ─────────────────────────────────────────────
  build-macos-arm64:
    needs: cleanup
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install libpng jpeg giflib libtiff webp

      - name: Build (macos_arm64)
        run: |
          mkdir -p dist
          BREW_PREFIX=$(brew --prefix)
          gcc -O3 -std=c11 -Wall -Wextra \
            -I"$BREW_PREFIX/include" -L"$BREW_PREFIX/lib" \
            "$SRC_PATH" \
            -lpng -ljpeg -lgif -ltiff -lwebp -lz -lm \
            -o "dist/ps2_tim2_tool_macos_arm64"

      - name: Upload to v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/ps2_tim2_tool_macos_arm64" --repo "$GITHUB_REPOSITORY" --clobber



  # ─────────────────────────────────────────────
  # macOS x86_64 — بدون انتظار جهاز Intel حقيقي (نادر جدًا في GitHub الآن):
  # cross-compile على نفس جهاز arm64 عبر vcpkg (مكتبات تُبنى من المصدر لهدف x64-osx)
  # ─────────────────────────────────────────────
  build-macos-x86_64:
    needs: cleanup
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Build dependencies from source (x64-osx)
        run: |
          ./vcpkg/vcpkg install libpng libjpeg-turbo giflib tiff libwebp --triplet=x64-osx

      - name: List installed libraries (تشخيص)
        run: |
          ls -la vcpkg/installed/x64-osx/lib || true

      - name: Build (macos_x86_64)
        run: |
          mkdir -p dist
          VCPKG_DIR="vcpkg/installed/x64-osx"
          clang -O3 -std=c11 -Wall -Wextra -arch x86_64 \
            -I"$VCPKG_DIR/include" -L"$VCPKG_DIR/lib" \
            "$SRC_PATH" \
            -lpng16 -ljpeg -lgif -ltiff -llzma -lwebp -lsharpyuv -lz -lm \
            -o "dist/ps2_tim2_tool_macos_x86_64"

      - name: Upload to v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/ps2_tim2_tool_macos_x86_64" --repo "$GITHUB_REPOSITORY" --clobber



  # ─────────────────────────────────────────────
  # Android (4 معماريات) — المكتبات غير متوفرة رسميًا، تُبنى من المصدر عبر vcpkg + NDK
  # ─────────────────────────────────────────────
  build-android:
    needs: cleanup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            triplet: arm64-android
            ndk_target: aarch64-linux-android
          - arch: armeabi-v7a
            triplet: arm-neon-android
            ndk_target: armv7a-linux-androideabi
          - arch: x86
            triplet: x86-android
            ndk_target: i686-linux-android
          - arch: x86_64
            triplet: x64-android
            ndk_target: x86_64-linux-android

    env:
      NDK_API: 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Build dependencies from source (${{ matrix.triplet }})
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./vcpkg/vcpkg install libpng libjpeg-turbo giflib tiff libwebp --triplet=${{ matrix.triplet }}

      - name: List installed libraries (تشخيص)
        run: |
          ls -la vcpkg/installed/${{ matrix.triplet }}/lib || true

      - name: Build (android-${{ matrix.arch }})
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p dist
          CLANG="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ndk_target }}${{ env.NDK_API }}-clang"
          VCPKG_DIR="vcpkg/installed/${{ matrix.triplet }}"
          "$CLANG" -O3 -std=c11 -Wall -Wextra \
            -I"$VCPKG_DIR/include" -L"$VCPKG_DIR/lib" \
            "$SRC_PATH" \
            -Wl,--start-group \
            -lpng16 -ljpeg -lgif -ltiff -llzma -lwebp -lsharpyuv -lz -lm \
            -Wl,--end-group \
            -static-libgcc \
            -o "dist/ps2_tim2_tool_android_${{ matrix.arch }}"

      - name: Upload to v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/ps2_tim2_tool_android_${{ matrix.arch }}" --repo "$GITHUB_REPOSITORY" --clobber



  # ─────────────────────────────────────────────
  # iOS (arm64 / x86_64) — المكتبات غير متوفرة رسميًا، تُبنى من المصدر عبر vcpkg
  # ─────────────────────────────────────────────
  build-ios:
    needs: cleanup
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triplet: arm64-ios
            sdk: iphoneos
            clang_arch: arm64
            min_version_flag: "-mios-version-min=13.0"
          - arch: x86_64
            triplet: x64-ios
            sdk: iphonesimulator
            clang_arch: x86_64
            min_version_flag: "-mios-simulator-version-min=13.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Build dependencies from source (${{ matrix.triplet }})
        run: |
          ./vcpkg/vcpkg install libpng libjpeg-turbo giflib tiff libwebp --triplet=${{ matrix.triplet }}

      - name: List installed libraries (تشخيص)
        run: |
          ls -la vcpkg/installed/${{ matrix.triplet }}/lib || true

      - name: Build (ios-${{ matrix.arch }})
        run: |
          mkdir -p dist
          SDK_PATH=$(xcrun --sdk ${{ matrix.sdk }} --show-sdk-path)
          VCPKG_DIR="vcpkg/installed/${{ matrix.triplet }}"
          clang -O3 -std=c11 -Wall -Wextra \
            -arch ${{ matrix.clang_arch }} -isysroot "$SDK_PATH" ${{ matrix.min_version_flag }} \
            -I"$VCPKG_DIR/include" -L"$VCPKG_DIR/lib" -F"$VCPKG_DIR/lib" \
            "$SRC_PATH" \
            -lpng16 -ljpeg -lgif -framework tiff -llzma -lwebp -lsharpyuv -lz -lm \
            -o "dist/ps2_tim2_tool_ios_${{ matrix.arch }}"

      - name: Upload to v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 "dist/ps2_tim2_tool_ios_${{ matrix.arch }}" --repo "$GITHUB_REPOSITORY" --clobber
