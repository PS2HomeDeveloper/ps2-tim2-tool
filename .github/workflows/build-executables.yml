name: Build Executables


on:
  workflow_dispatch:


permissions:
  contents: write

jobs:



  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          if [ -z "$assets" ]; then
            echo "لا توجد ملفات مرفوعة حاليًا بالإصدار."
          else
            for name in $assets; do
              echo "حذف: $name"
              gh release delete-asset v1.0.0 "$name" --repo "$GITHUB_REPOSITORY" -y
            done
          fi



      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move v1.0.0 tag to latest commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f v1.0.0
          git push origin v1.0.0 --force



  build:
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
            python-arch: x64
            ext: ".exe"
          - target: windows-x86_32
            os: windows-latest
            python-arch: x86
            ext: ".exe"
          - target: windows-arm64
            os: windows-11-arm
            python-arch: arm64
            ext: ".exe"
          - target: linux-x86_64
            os: ubuntu-latest
            python-arch: x64
            ext: ""
          - target: linux-arm64
            os: ubuntu-24.04-arm
            python-arch: arm64
            ext: ""
          - target: macos-arm64
            os: macos-14
            python-arch: arm64
            ext: ""

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name "ps2-tim2-tool-${{ matrix.target }}" ps2_tim2_tool.py

      - name: Upload to v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          FILE="dist/ps2-tim2-tool-${{ matrix.target }}${{ matrix.ext }}"
          gh release upload v1.0.0 "$FILE" --repo "$GITHUB_REPOSITORY" --clobber



  build-android:
    needs: cleanup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            docker_tag: aarch64
          - arch: armeabi-v7a
            docker_tag: arm
          - arch: x86_64
            docker_tag: x86_64
          - arch: x86
            docker_tag: i686

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (لمحاكاة المعماريات غير الأصلية)
        uses: docker/setup-qemu-action@v3

      - name: Build inside Termux container (${{ matrix.arch }})
        run: |
          mkdir -p dist
          docker run --rm --privileged \
            -v "${{ github.workspace }}:/workdir" \
            -w /workdir \
            "termux/termux-docker:${{ matrix.docker_tag }}" \
            bash -s <<'EOF'
          set -e
          echo "deb https://packages.termux.dev/apt/termux-main stable main" > $PREFIX/etc/apt/sources.list
          pkg update -y
          pkg install -yq python build-essential
          command -v ldd >/dev/null 2>&1 || { printf '#!/data/data/com.termux/files/usr/bin/sh\nexit 1\n' > $PREFIX/bin/ldd && chmod +x $PREFIX/bin/ldd; }
          pip install pyinstaller Pillow
          pyinstaller --onefile --name ps2-tim2-tool-android-${{ matrix.arch }} ps2_tim2_tool.py
          EOF

      - name: Verify output
        run: |
          ls -la "dist/ps2-tim2-tool-android-${{ matrix.arch }}"
          file "dist/ps2-tim2-tool-android-${{ matrix.arch }}"

      - name: Upload to v1.0.0 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="dist/ps2-tim2-tool-android-${{ matrix.arch }}"
          gh release upload v1.0.0 "$FILE" --repo "$GITHUB_REPOSITORY" --clobber
